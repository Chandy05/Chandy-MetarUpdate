name: Auto Capture METAR & TAF Cards

on:
  schedule:
    # รันทุกต้นชั่วโมง (นาทีที่ 05) ตั้งแต่ 05:05 - 19:05 น. เวลาไทย (22:05 - 12:05 UTC)
    - cron: '5 22-23,0-12 * * *'
  workflow_dispatch: # กดสั่งรันทดสอบด้วยมือได้ทันที

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Capture METAR & TAF Cards
        run: |
          cat << 'EOF' > run_capture.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            fs.mkdirSync('wx_out', { recursive: true });
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });

            console.log('1. กำลังเปิดหน้า Dashboard...');
            await page.goto('https://chandy05.github.io/Chandy-MetarUpdate/', { waitUntil: 'networkidle', timeout: 60000 });

            // รอจนกว่าข้อมูล METAR/TAF จะโหลดเสร็จ (#overlay ซ่อนตัว)
            await page.waitForFunction(() => {
              const ov = document.getElementById('overlay');
              return !ov || ov.classList.contains('hide');
            }, { timeout: 30000 });

            // สลับช่องที่ 3 จาก Mission เป็น TMD RADAR
            console.log('2. สลับช่องที่ 3 เป็น TMD RADAR...');
            await page.evaluate(() => {
              if (typeof switchPanelTab === 'function') switchPanelTab('radar');
            });
            await page.waitForTimeout(4000);

            // กดสร้างภาพ METAR
            console.log('3. กำลังสร้างการ์ด METAR VTMM...');
            await page.evaluate(() => {
              window._briefBlob = null;
              generateBriefingImage();
            });
            await page.waitForFunction(() => window._briefBlob instanceof Blob, { timeout: 45000 });

            const metarB64 = await page.evaluate(async () => {
              return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(window._briefBlob);
              });
            });
            fs.writeFileSync('wx_out/metar_vtmm.png', Buffer.from(metarB64, 'base64'));
            console.log('✅ บันทึก metar_vtmm.png สำเร็จ');

            // ปิด Modal แล้วสลับไปโหมด TAF
            await page.evaluate(() => {
              if (typeof closeBriefingModal === 'function') closeBriefingModal();
              if (typeof setWxMode === 'function') setWxMode('TAF');
            });

            // รอแผนที่ Leaflet และรายงาน AI วิเคราะห์เสร็จ
            console.log('4. รอโหลดแผนที่และ AI Report สำหรับ TAF...');
            await page.waitForFunction(() => {
              const el = document.getElementById('ai-report-content');
              return el && el.dataset.analysisState === 'completed';
            }, { timeout: 45000 }).catch(() => console.log('⚠️ รอ AI timeout, ดำเนินการแคปต่อ...'));
            await page.waitForTimeout(4000);

            // กดสร้างภาพ TAF
            console.log('5. กำลังสร้างการ์ด TAF VTMM...');
            await page.evaluate(() => {
              window._briefBlob = null;
              generateBriefingImage();
            });
            await page.waitForFunction(() => window._briefBlob instanceof Blob, { timeout: 45000 });

            const tafB64 = await page.evaluate(async () => {
              return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(window._briefBlob);
              });
            });
            fs.writeFileSync('wx_out/taf_vtmm.png', Buffer.from(tafB64, 'base64'));
            console.log('✅ บันทึก taf_vtmm.png สำเร็จ');

            await browser.close();
          })();
          EOF
          node run_capture.js

      - name: Push to orphan branch wx-cards (Auto-delete old files & history)
        run: |
          cd wx_out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b wx-cards
          git add metar_vtmm.png taf_vtmm.png
          git commit -m "Update VTMM METAR & TAF cards (auto-cleanup)"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin wx-cards
